# 배포만 담당: Claude Code 예약 실행(pipeline/routine-prompt.md)이 web/today.json을 push하면 GitHub Pages로 공개.
name: deploy-pages
on:
  push: { paths: ["web/**"] }
  workflow_dispatch: {}
concurrency: { group: pages, cancel-in-progress: false }   # 배포가 겹치면 차례로
permissions: { contents: read, pages: write, id-token: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - name: 화면 스크립트 문법 검사 (깨진 화면 공개 방지)
        run: sed -n '/<script>/,/<\/script>/p' web/index.html | sed '1d;$d' > /tmp/page.js && node --check /tmp/page.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - uses: actions/deploy-pages@v4
