<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>요즘 시장의 관심사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style id="tokens">
/* ⬇ tokens.css v0.7 복사본 — 직접 고치지 말고 02-UX-시안/design-system/tokens.css를 다시 복사 */
/* =========================================================
   my-service 디자인 시스템 v0.7 (2026-11-26) — 기본 색·글꼴은 Apple HIG 시스템 값 기반
   개발은 이 파일을 그대로 불러 쓰고, 값은 여기서만 바꾼다.
   ========================================================= */
:root{
  /* ---------- 색: 바탕 ---------- */
  --color-bg:            #FFFFFF;  /* v0.9: Apple systemBackground — 페이지 흰색 */
  --surface-box:         #F2F2F7;  /* v0.9: 박스 = systemGray6. 흐름도·다음에 볼 지표·상태 배너·셀렉트 버튼에만 */
  --surface-1:           #FFFFFF;  /* Apple secondarySystemGroupedBackground */
  --surface-2:           #FFFFFF;  /* 흐름도 무대 (칸은 테두리+그림자로 띄움) */
  --surface-sunken:      #E5E5EA;  /* v0.9: Apple systemGray5 — 회색 박스 안 선택·세그먼트 바탕 */
  --border-1:            #E5E5EA;  /* Apple systemGray5 */
  --border-2:            #D1D1D6;  /* Apple systemGray4 */

  /* ---------- 색: 글자 ---------- */
  --text-1:              #000000;  /* Apple label */
  --text-2:              #6C6C70;  /* Apple systemGray (접근성 고대비 값). secondaryLabel(60%)은 작은 글자 대비 4.5:1 미달이라 이 값 사용 */
  --text-3:              #AEAEB2;  /* Apple systemGray2 — 비활성·자리표시 전용 */

  /* ---------- 색: 의미 (섞지 않는다) ---------- */
  /* 1) 방향 = 사실. 오름/내림, 예상보다 높음/낮음 */
  --dir-up:              #FF3B30;  /* Apple systemRed */
  --dir-down:            #007AFF;  /* Apple systemBlue */
  --dir-flat:            #C7C7CC;  /* Apple systemGray3 */
  /* 2) 의미 = 해석. 호재 쪽/악재 쪽, 선택됨 */
  --meaning:             #5856D6;  /* Apple systemIndigo */
  --meaning-soft:        #EEEEFB;  /* systemIndigo 10% on white */
  /* 3) 관심사 = 판단 기준 칸 */
  --interest:            #FF9500;  /* Apple systemOrange */
  --interest-soft:       #FFF4E5;  /* systemOrange 10% on white */
  --interest-text:       #C93400;  /* Apple systemOrange 접근성 고대비 값 (글자용) */

  /* ---------- 선 ---------- */
  --edge-idle:           #C7C7CC;  /* Apple systemGray3 */
  --edge-w-idle:         1.5px;
  --edge-w-on:           2.5px;
  --edge-dash:           6 4;      /* 가정 */
  --edge-hypo-opacity:   .6;

  /* ---------- 글자 ---------- */
  --font-sans: "Pretendard", "Pretendard Variable", "Apple SD Gothic Neo", -apple-system, sans-serif;  /* 사용자 지정: Pretendard 우선, 없으면 Apple SD Gothic Neo */
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;  /* Apple SF Mono */
  --fs-display: 20px;   /* Apple Title3 */
  --fs-title:   17px;   /* Apple Headline (semibold) */
  --fs-section: 15px;   /* Apple Subheadline semibold — 섹션 제목 */
  --fs-body:    15px;   /* Apple Subheadline — 본문, 버튼 */
  --fs-label:   13px;   /* Apple Footnote — 칸 이름, 행 */
  --fs-caption: 12px;   /* Apple Caption1 — 보조 설명 */
  --fs-mono:    11px;   /* Apple Caption2 — 구역·슬롯·보조 라벨 */
  --fw-regular: 400; --fw-medium: 500; --fw-bold: 600;  /* Apple은 강조에 semibold */
  --lh-tight: 1.3; --lh-body: 1.55;

  /* ---------- 간격 (4 배수) ---------- */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;

  /* ---------- 모서리 ---------- */
  --r-tag: 8px; --r-control: 12px; --r-node: 12px; --r-panel: 16px; --r-stage: 28px; --r-pill: 999px;

  /* ---------- 깊이 ---------- */
  --shadow-node:  0 1px 0 #fff inset, 0 2px 6px rgba(20,24,32,.06);
  --shadow-panel: none;  /* v0.4: 카드 그림자 제거 (사용자 요청). 카드는 배경색 차이로만 구분 */
  --glow-meaning: 0 0 0 3px rgba(88,86,214,.14), 0 0 14px rgba(88,86,214,.25);

  /* ---------- 움직임 ---------- */
  --motion-flow: 1.2s;  /* 칸 하나를 빛이 지나는 시간 */
  --motion-rest: 2.6s;  /* 반복 사이 쉼 */
  --motion-ui:   .2s;
  --ease: cubic-bezier(.2,.8,.2,1);
}

/* =================== 컴포넌트 =================== */
.ds{font-family:var(--font-sans);color:var(--text-1)}

/* 흐름도 칸 */
.ds-node{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:84px;min-height:42px;padding:var(--sp-2) var(--sp-3);
  background:var(--surface-1);border:1px solid var(--border-1);border-radius:var(--r-node);box-shadow:var(--shadow-node);font-size:var(--fs-label);font-weight:var(--fw-medium)}
.ds-node small{font-family:var(--font-mono);font-size:var(--fs-mono);color:var(--text-2);font-weight:var(--fw-regular)}
.ds-node.is-on{font-weight:var(--fw-bold);box-shadow:var(--shadow-node),var(--glow-meaning);border-color:transparent}
.ds-node.is-on.is-hypo{box-shadow:var(--shadow-node);border:1.5px dashed var(--meaning)}
.ds-node.is-interest{border:2px solid var(--interest)}
.ds-node.is-interest::before{content:"관심사";position:absolute;top:-17px;left:2px;font-family:var(--font-mono);font-size:var(--fs-mono);color:var(--interest-text)}
.ds-node.is-next{background:transparent;box-shadow:none;border:1.5px dashed var(--border-2);color:var(--text-2)}
.ds-node.is-idle{color:var(--text-3)}
.ds-node .ds-dir{position:absolute;top:5px;right:7px}

/* 미국|한국 슬롯 칸 */
.ds-slots{display:flex;gap:6px;margin-top:4px}
.ds-slot{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:38px}
.ds-slot b{display:flex;align-items:center;justify-content:center;width:38px;height:20px;font-size:13px;color:var(--text-3);font-weight:var(--fw-regular)}
.ds-slot span{font-family:var(--font-mono);font-size:var(--fs-mono);color:var(--text-2)}

/* 방향 표시: 채움 = 일어남, 빈 모양 = 가정 */
.ds-dir{display:inline-block;font-size:12px;line-height:1}
.ds-dir.up{color:var(--dir-up)} .ds-dir.down{color:var(--dir-down)} .ds-dir.flat{color:var(--dir-flat)}
.ds-dir.up::before{content:"▲"} .ds-dir.down::before{content:"▼"} .ds-dir.flat::before{content:"–"}
.ds-dir.hypo.up::before{content:"△"} .ds-dir.hypo.down::before{content:"▽"}

/* 사건 칩 */
.ds-chip{font:inherit;font-size:var(--fs-label);display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-pill);border:1px solid var(--border-2);background:var(--surface-1);color:var(--text-1);cursor:pointer;white-space:nowrap}
.ds-chip small{font-size:var(--fs-caption);color:var(--text-2);font-weight:var(--fw-bold)}
.ds-chip small.dday{color:var(--meaning)}
.ds-chip.is-selected{border-color:var(--meaning);background:var(--meaning-soft);color:var(--meaning);font-weight:var(--fw-bold)}

/* 관심사 규칙 세그먼트 */
.ds-rule{display:inline-flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-label);color:var(--text-2)}
.ds-rule .key{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r-pill);background:var(--interest-soft);color:var(--interest-text);font-weight:var(--fw-bold)}
.ds-rule .key::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--interest)}
.ds-seg{display:inline-flex;background:var(--surface-sunken);border-radius:var(--r-pill);padding:3px;gap:2px}
.ds-seg span{padding:4px 10px;border-radius:var(--r-pill);font-size:var(--fs-caption);color:var(--text-3);font-weight:var(--fw-medium)}
.ds-seg span.is-on{background:var(--interest);color:#fff;font-weight:var(--fw-bold)}
.ds-seg span.is-on.is-hypo{background:transparent;color:var(--interest-text);box-shadow:inset 0 0 0 1.5px var(--interest);outline:0}

/* 시나리오 버튼 */
.ds-scen{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.ds-scen-label{font-size:var(--fs-caption);color:var(--text-2);margin-bottom:var(--sp-2)}
.ds-scen button{font:inherit;font-size:var(--fs-label);font-weight:var(--fw-bold);min-height:48px;border-radius:var(--r-control);border:1.5px solid var(--border-2);background:var(--surface-1);color:var(--text-1);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.ds-scen button.is-selected{border-color:var(--meaning);background:var(--meaning-soft);color:var(--meaning)}
.ds-scen button:disabled{color:var(--text-3);background:var(--surface-sunken);border-color:transparent;cursor:default}

/* 쪽 태그 (의미) */
.ds-side{display:inline-flex;align-items:center;padding:2px 9px;border-radius:var(--r-pill);font-size:var(--fs-caption);font-weight:var(--fw-bold);white-space:nowrap}
.ds-side.bad{background:var(--meaning);color:#fff}
.ds-side.good{background:var(--surface-1);color:var(--meaning);box-shadow:inset 0 0 0 1.5px var(--meaning)}
.ds-side.none{background:var(--surface-sunken);color:var(--text-2)}
.ds-side.hint::before{content:"보통";font-weight:var(--fw-medium);margin-right:3px}

/* 힌트 카드 */
.ds-hint{border-radius:var(--r-control);padding:var(--sp-3);background:var(--surface-1);border:1.5px dashed var(--meaning)}
.ds-hint.is-actual{border-style:solid;background:var(--meaning-soft)}
.ds-hint h4{margin:0 0 var(--sp-2);font-size:var(--fs-caption);color:var(--text-2);font-weight:var(--fw-medium)}
.ds-cond{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:var(--fs-label)}
.ds-cond .c{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:var(--r-tag);background:var(--surface-sunken)}

/* 판단 재료 행 */
.ds-row{display:grid;grid-template-columns:1fr auto;gap:2px var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid var(--border-1)}
.ds-row .name{font-size:var(--fs-label);font-weight:var(--fw-bold)}
.ds-row .val{grid-column:1;font-size:var(--fs-caption);color:var(--text-2);display:flex;gap:6px;align-items:center}
.ds-row .ds-side{grid-column:2;grid-row:1 / span 2;align-self:center}
.ds-row.is-interest{background:var(--interest-soft);border-radius:var(--r-tag);padding:var(--sp-3);border-bottom:0;margin-bottom:var(--sp-1)}


/* 패널 / 섹션 */
.ds-panel{background:var(--surface-1);border-radius:var(--r-panel);padding:var(--sp-5);  /* v0.5: 카드 기본 여백 24 (사용자 요청) */
  box-shadow:var(--shadow-panel)}
.ds-section-title{font-size:var(--fs-section);font-weight:var(--fw-bold);margin:var(--sp-5) 0 var(--sp-2)}
.ds-stage{background:var(--surface-2);border-radius:var(--r-stage);padding:var(--sp-5)}

/* 동작 줄이기 */
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* ===== v0.6 서비스 상태 컴포넌트 (2026-11-26) ===== */
/* 휴장 슬롯: 방향 없이 모노 라벨 */
.ds-slot.is-closed b{font-family:var(--font-mono);font-size:var(--fs-mono);color:var(--text-3)}
/* 상태 배너: 지연·오류·조용한 날. 오류도 빨강을 쓰지 않는다(빨강 = 오름) */
.ds-banner{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-control);background:var(--surface-sunken);color:var(--text-2);font-size:var(--fs-label)}
.ds-banner b{color:var(--text-1);font-weight:var(--fw-bold)}
.ds-banner button{font:inherit;font-size:var(--fs-label);font-weight:var(--fw-bold);color:var(--meaning);background:none;border:0;padding:4px 0;cursor:pointer;white-space:nowrap}
/* 관심사 변경 첫날 공지: 관심사 박스 안 맨 위 한 줄 */
.ds-interest-change{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-caption);color:var(--interest-text);font-weight:var(--fw-bold);margin-bottom:var(--sp-2)}
.ds-interest-change s{color:var(--text-3);font-weight:var(--fw-regular)}
/* 두 단계 확인 */
.ds-confirm{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;font-size:var(--fs-caption);color:var(--text-2)}
.ds-confirm .step{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-pill);background:var(--surface-sunken)}
.ds-confirm .step b{color:var(--text-1)}
.ds-confirm .step.is-done{background:var(--meaning-soft);color:var(--meaning)}
.ds-confirm .step.is-done::before{content:"✓";font-weight:var(--fw-bold)}
.ds-confirm .arrow{color:var(--text-3)}

/* ===== v0.7 관심사 셀렉트 (2026-11-26, 사용자 선택: A 셀렉트) ===== */
.ds-interest-select{display:inline-flex;align-items:center;gap:var(--sp-2)}
.ds-interest-select select{font:inherit;font-size:var(--fs-label);font-weight:var(--fw-bold);color:var(--interest-text);padding:8px 32px 8px 12px;border-radius:10px;border:1px solid var(--border-2);background:#fff;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),linear-gradient(135deg,var(--text-2) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;min-height:40px}
.ds-interest-select .count{font-size:var(--fs-caption);color:var(--text-2)}  /* "관심사 3개 · 바꿔볼 수 있어요" */
/* 판정 뒤집힘 */
@keyframes ds-flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.ds-side.is-flipping{animation:ds-flip .55s var(--ease)}
.sidetag.is-flipping{animation:ds-flip .55s var(--ease);transform-box:fill-box;transform-origin:center}
.ds-flip-note{font-size:var(--fs-caption);font-weight:var(--fw-bold);color:var(--meaning);background:var(--meaning-soft);border-radius:var(--r-tag);padding:var(--sp-2) 10px}

/* ⬆ tokens.css 끝 */
</style>
<style>
  /* v3.1: 흐름도 하나(위 고정) + 사건 칩 + 시나리오 패널. 모바일 세로 흐름, PC는 640px 칼럼 */
  :root {   /* 화면 안 별칭 → 디자인 시스템 토큰 */
    --bg: var(--color-bg); --card: var(--surface-1); --line: var(--border-2); --ink: var(--text-1); --sub: var(--text-2); --faint: var(--border-1);
    --up: var(--dir-up); --down: var(--dir-down);                 /* 방향(사실) */
    --accent: var(--meaning); --accent-soft: var(--meaning-soft); /* 의미(호재/악재 쪽) */
    --amber: var(--interest);                                     /* 요즘 시장의 관심사 */
    --edge: var(--edge-idle); --debug: #1F2329;                   /* debug = 테스트 바(참가자 화면 밖) */
    --dbg-h: 0px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;   /* 숫자 폭 고정은 값 줄(.jv)에만 — 문장·날짜에서 "12/2"가 벌어져 보임 (사용자 11/27) */
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg text:not([font-family]) { font-family: var(--font-sans); }

  /* ── 테스트 진행용 바 (참가자 화면 밖) ── */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--debug); }
  .debug {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
    background: var(--debug); color: #fff; font-size: var(--fs-caption);
    padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
    display: flex; gap: 4px; align-items: center;
    overflow-x: auto; white-space: nowrap; scrollbar-width: none;
  }
  .debug::-webkit-scrollbar { display: none; }
  .debug > span { color: #8B95A1; margin-right: 4px; flex-shrink: 0; }
  .debug button { flex-shrink: 0; border: 0; border-radius: 6px; padding: 5px 9px; font-size: var(--fs-caption); background: #3A3F47; color: #D1D6DB; }
  .debug button.on { background: var(--accent); color: #fff; }
  .debug .sep { width: 8px; flex-shrink: 0; }
  .debug .hide { margin-left: auto; background: transparent; color: #8B95A1; }
  .debug-off .debug, .debug-off body::before { display: none; }
  .debug-dot {
    display: none; position: fixed; z-index: 30;
    right: calc(8px + env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    width: 28px; height: 28px; border-radius: 50%; border: 0;
    background: rgba(31,35,41,.12); color: var(--sub); font-size: var(--fs-caption);
  }
  .debug-off .debug-dot { display: block; }

  /* ── 페이지 ── */
  .page {
    max-width: 640px; margin: 0 auto;
    padding-block: 12px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (min-width: 768px) { .page { padding-block: 28px 64px; } }

  /* 흐름도 머리: 요즘 시장의 관심사 + 규칙 (흐름도와 같이 고정) */
  .basis.nodata { font-size: var(--fs-caption); color: var(--text-2); margin-top: 8px; }
  .sgrp { display: grid; grid-template-columns: 56px 1fr; gap: 8px; align-items: start; margin: 12px 0; font-size: var(--fs-body); }
  .sgrp b { font-size: var(--fs-label); color: var(--text-2); padding-top: 5px; }
  .schip { display: inline-block; margin: 0 6px 6px 0; padding: 5px 10px; border-radius: var(--r-pill); background: var(--surface-sunken); font-size: var(--fs-label); }
  .schip.hl { background: var(--meaning-soft); color: var(--meaning); font-weight: var(--fw-bold); }
  .ipick { margin-bottom: var(--sp-3); }
  .icard { background: var(--surface-1); border-radius: var(--r-panel); padding: var(--sp-4); margin-top: 10px; }
  @media (min-width: 640px) { .icard { padding: var(--sp-5); } }
  .src { margin-top: 16px; font-size: var(--fs-caption); color: var(--text-2); }
  .src summary { cursor: pointer; }
  .src a { display: block; margin-top: 6px; color: var(--meaning); word-break: break-all; }
  .no-dev .debug-dot { display: none !important; }
  .asof { font-size: var(--fs-caption); color: var(--text-2); margin: 12px 2px 0; }   /* 기준 시각 (02-UX) */
  .ibox { padding: 0; }
  .trig { margin-top: 6px; font-size: var(--fs-caption); color: var(--text-2); }
  .wcard { margin-top: 12px; padding: var(--sp-4); border-radius: var(--r-control); background: var(--surface-sunken); }
  .wcard .wl { font-size: var(--fs-caption); color: var(--text-2); }
  .wcard .wn { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin-top: 4px; font-size: var(--fs-body); }
  .wcard .wv { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-label); }
  .wcard .wx { margin-top: 2px; font-size: var(--fs-caption); color: var(--text-2); }

// 영향 흐름: 빛이 출발 → 도착으로 칸 순서대로 지나가고, 잠깐 쉬었다 반복
function playFlow() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const gl = [...document.querySelectorAll(".flow .glint")];
  if (!gl.length || !gl[0].animate) return;
  const SEG = 1200, GAP = 2600;
  const steps = 1 + Math.max(...gl.map(p => +p.dataset.depth));
  const T = steps * SEG + GAP;
  gl.forEach(p => {
    const d = +p.dataset.depth, len = +p.getAttribute("stroke-dasharray").split(" ")[0];
    const s = d * SEG / T, e = (d + 1) * SEG / T;
    p.animate([
      { offset:0, strokeDashoffset:len },
      { offset:s, strokeDashoffset:len, easing:"ease-in-out" },
      { offset:e, strokeDashoffset:-1 },
      { offset:1, strokeDashoffset:-1 }
    ], { duration:T, iterations:Infinity });
  });
}

function topicsFromV1() {
  const KT = D.ktags || {}, SV = D.sv || {};
  const SER = { us: { cpi: "us_cpi", job: "us_jobs", rate: "us_10y", fx: "usdkrw", stock: "sp500", oil: "wti", vix: "vix", kospi: "kospi" },
                kr: { cpi: "kr_cpi", rate: "ktb3y", fx: "usdkrw", stock: "kospi", oil: "wti", vix: "vix", kospi: "kospi" } };
  const DEF = { mkt: "시장에서 매일 정해지는 금리예요. 앞으로 기준금리가 어떻게 될지에 대한 예상이 담겨요", base: "중앙은행이 회의에서 정하는 금리예요" };
  return (D.interests || []).map((I0, ix) => {
    const I = Object.assign({}, I0, { name: iName(I0) }), c = bCountry(I, []), path = bPath(I, c);
    const done = (D.events || []).find(e => e.kind === "done" && (e.country || "kr") === c && touches(e, I.node));
    const baseKey = I.node === "rate" ? (c === "us" ? "us_base" : "kr_base") : SER[c][I.node];
    const cells = [];
    const mk = (k, parent) => { const sk = k === I.node ? baseKey : SER[c][k], v = SV[sk];
      const nm = k === I.node && k === "rate" ? CPFX(c) + "기준금리" : bName(k, c);
      const mv = (I.moves || []).find(m => m.node === k);
      return { key: k, name: nm, short: k === "kospi" ? "코스피" : k === "stock" ? (c === "us" ? "S&P500" : "코스피") : k === "fx" ? "원/달러" : (NG[k] && NG[k].t) || nm, view: v || null, parent,
        parentName: null, basic: true, why: mv && mv.why, why_sources: mv ? mv.sources : [], link_prev: mv ? mv.link_prev : "unknown",
        why_rule: parent ? bWhy(parent + ">" + k, c) : null, next_day: k === "kospi" && c === "us",
        def: k === "rate" ? (k === I.node ? `${nm}|${DEF.base}` : `${nm}|${DEF.mkt}`) : "" }; };
    cells.push(mk(I.node, null));
    const ORD = k => k === "stock" ? 1 : k === "kospi" ? 2 : 0, seen = new Set([I.node]);
    path.slice().sort((p, q) => ORD(p[1]) - ORD(q[1])).forEach(([a, b]) => { if (seen.has(b)) return; seen.add(b); cells.push(mk(b, a)); });
    cells.forEach((x, i) => { if (i && x.parent && cells[i - 1].key !== x.parent) x.parentName = (cells.find(y => y.key === x.parent) || {}).name; });
    if (I.fact) { const fm = I.fact.match(/^(\d{1,2}\/\d{1,2})/); if (fm) cells[0].metaDate = fm[1]; }
    const iv = cells[0].view, iDir = iv && iv.dir;
    const K = (done && done.ktype && KT[done.ktype]) || (I.node === "rate" && exTextOf(done) === "예상대로" ? KT["K5-2"]
      : (Object.entries(KT).find(([, v]) => v.node === I.node && v.dir === iDir && !v.market && !v.none) || [])[1]);
    const side = !K || K.none ? null : K.sure || ((K.conds || []).find(q => (q.interest || []).includes(I.node)) || {}).side;
    const st = cells.find(x => x.key === "stock"), sd = st && st.view && st.view.dir;
    const actual = side && sd && sd !== (side === "good" ? "up" : "down") ? { name: st.name, dir: sd } : null;
    const nr0 = I.next_rel, nr = nr0 && ((/^(US_|FOMC)/.test(nr0.code) ? "us" : "kr") === c) ? nr0 : null;   // {다음 발표}는 관심사 나라와 같은 것만, 없으면 ④ 안 그림
    return { name: I.name, rank: I.rank || ix + 1, reason: (I.reason && I.reason.label) || (nr ? `${nr.name} ${nr.md}` : null), c, curNode: I.node,
      compareText: exTextOf(done) || (iv && iv.dir ? (iv.dir === "up" ? "지난번보다 높음" : "지난번보다 낮음") : null),
      path: cells, read: K ? { type: "k", sure: K.sure, reason: K.reason, conds: K.conds, none: K.none } : null, actual,
      next: nr ? { name: nr.name, md: nr.md } : null, sources: I.sources || [] };
  });
}
// ② 선을 차례로 그리는 동안 내레이션을 그 선의 "왜"로 바꿈, 다 그리면 목록
function bPlay() {
  const p = document.getElementById("bwhy"), l = document.getElementById("bwl");
  if (!p || !l) return;
  const items = [...l.children], dur = 1200;
  clearTimeout(bPlay.t); let i = 0;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { p.hidden = true; l.hidden = false; return; }
  const tick = () => { if (i >= items.length) { p.hidden = true; l.hidden = false; return; } p.innerHTML = items[i].innerHTML; i++; bPlay.t = setTimeout(tick, dur); };
  tick();
}

function sheetHTML() {
  const e = cur(), groups = (e.sectors && e.sectors[S.tab]) || [];
  return `<div class="grab"></div><h3>이 사건에 더 크게 / 덜 영향받는 업종</h3>
    <div class="hint" style="margin-top:4px">오른다·내린다가 아니라 흔들리는 크기예요</div>
    <div class="tabs" role="tablist"><button data-tab="us" class="${S.tab === "us" ? "on" : ""}">미국</button><button data-tab="kr" class="${S.tab === "kr" ? "on" : ""}">한국</button></div>
    ${groups.length ? groups.map(([g, list]) => `<div class="sgrp"><b>${h(g)}</b><div>${list.map(n => `<span class="schip ${e.highlight === n ? "hl" : ""}">${h(n)}</span>`).join("")}</div></div>`).join("")
      : `<div class="hint">해당 업종이 없어요</div>`}
    ${S.tab === "kr" ? `<div class="hint">한국 업종은 환율·외국인 수급을 한 번 더 거쳐서 연결이 약해요</div>` : ""}`;
}

// 개발용 바 (?dev=1): 샘플 상태 파일 바꿔 보기
const MOCKS = [["today.json","오늘"],["mock/quiet.json","조용한 날"],["mock/release.json","발표 당일"],["mock/split.json","미·한 갈라짐"],["mock/delayed.json","데이터 지연"],["mock/closed.json","휴장"],["mock/interest-change.json","관심사 변경"],["mock/one-interest.json","관심사 1개"],["mock/missing.json","오류"],["mock/t2.json","T2 샘플"],["mock/us.json","미국 사건 샘플"]];
function buildDebug() {
  const d = document.getElementById("debug");
  if (Q.get("dev") !== "1") { document.documentElement.classList.add("debug-off", "no-dev"); return; }
  d.innerHTML = `<span>데이터</span>` + MOCKS.map(([f, t]) => `<button data-file="${f}" class="${DATA_URL === f ? "on" : ""}">${t}</button>`).join("") +
    `<i class="sep"></i><button data-reset>내 판단 초기화</button><button class="hide" data-hide>숨기기 ✕</button>`;
}
function syncDbgH() {
  const d = document.getElementById("debug");
  const hgt = document.documentElement.classList.contains("debug-off") ? 0 : d.offsetHeight;
  document.documentElement.style.setProperty("--dbg-h", hgt + "px");
}
function tabIntoView() {   // 선택 탭이 화면 밖이면 가로로만 스크롤
  const c = document.querySelector(".chips"), t = c && c.querySelector(".chip.on");
  if (!t) return;
  const l = t.offsetLeft - c.offsetLeft, r = l + t.offsetWidth;
  if (l < c.scrollLeft) c.scrollLeft = l - 8; else if (r > c.scrollLeft + c.clientWidth) c.scrollLeft = r - c.clientWidth + 40;
}
function render() {
  buildDebug();
  document.getElementById("app").innerHTML = home();
  syncDbgH(); if (LOAD === "ok") { saveURL(); playFlow(); fitFlow(); tabIntoView(); }
}

/* ───────── 업종 시트 ───────── */
let lastFocus = null;
function openSheet() {
  lastFocus = document.activeElement;
  S.tab = cur().sectorTab || "us";
  const sh = document.getElementById("sheet");
  sh.innerHTML = sheetHTML(); sh.classList.add("open");
  document.getElementById("dimbg").classList.add("open");
  sh.setAttribute("tabindex", "-1"); sh.focus();
}
function closeSheet() {
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("dimbg").classList.remove("open");
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

document.addEventListener("click", ev => {
  const ic = ev.target.closest("[data-ichip]");
  if (ic) { pickInt(ic.dataset.ichip); return; }
  if (ev.target.closest("[data-iopen]")) { S.iopen = !S.iopen; render(); if (S.iopen) focusOpt(); return; }
  if (S.iopen && !ev.target.closest(".isel")) { S.iopen = false; render(); }   // 바깥 누르면 닫힘
  if (BMODE && LOAD === "ok") {
    const b = ev.target.closest("[data-btp],[data-b4h],[data-bdefs],[data-bdefs-close],[data-bdef],[data-bmore],[data-brow],[data-bev],[data-bopt],[data-breset]");
    if (b) { const d = b.dataset; S.flip = null;
      if (d.btp !== undefined) { S.tp = +d.btp; S.iopen = false; S.b4open = {}; }
      else if (d.b4h) { S.b4open = S.b4open || {}; S.b4open[d.b4h] = !S.b4open[d.b4h]; }
      else if (d.bdefs) S.bdefs = d.bdefs;
      else if (d.bdefsClose !== undefined) S.bdefs = null;
      else if (d.bdef) { S.bdef = S.bdef || {}; S.bdef[d.bdef] = !S.bdef[d.bdef]; }
      else if (d.bmore !== undefined) S.bmore = true;
      else if (d.brow) { if (bFade() === 1 && !S.bAllOpen) return; S.bopen = S.bopen || {}; S.bopen[d.brow] = !S.bopen[d.brow]; }
      else if (d.bev) { S.bev = d.bev; S.bopt = null; }
      else if (d.bopt) S.bopt = S.bopt === d.bopt ? null : d.bopt;
      else if (d.breset !== undefined) S.bAllOpen = true;
      render(); return; }
  }
  const t = ev.target.closest("[data-legend],[data-file],[data-retry],[data-reset],[data-hide],#debugDot,[data-ev],[data-opt],[data-pick],[data-sector],[data-tab],.tapstock,#dimbg");
  if (!t) return;
  const d = t.dataset; S.flip = null;
  if (d.opt && !S.tried) { S.tried = true; try { localStorage.setItem("mf-tried", "1"); } catch (_) {} }
  if (d.legend !== undefined) S.legend = !S.legend;
  else if (d.file) { const q = new URLSearchParams(location.search); q.set("data", d.file); q.delete("ev"); location.search = q; return; }
  else if (d.retry !== undefined) { load(); return; }
  else if (d.reset !== undefined) { S.pick = {}; savePicks(); }
  else if (d.hide !== undefined) { document.documentElement.classList.add("debug-off"); syncDbgH(); return; }
  else if (t.id === "debugDot") { document.documentElement.classList.remove("debug-off"); syncDbgH(); return; }
  else if (LOAD !== "ok") return;
  else if (d.ev) { S.ev = d.ev; S.opt = null; }
  else if (d.opt) S.opt = S.opt === d.opt ? null : d.opt;               // 다시 누르면 해제
  else if (d.pick) { S.pick[S.ev] = d.pick; savePicks(); }
  else if (d.sector !== undefined || t.classList.contains("tapstock")) { if (SHOW_SECTORS && cur().sectors) openSheet(); return; }
  else if (d.tab) { S.tab = d.tab; document.getElementById("sheet").innerHTML = sheetHTML(); return; }
  else if (t.id === "dimbg") { closeSheet(); return; }
  render();
});
document.addEventListener("change", ev => {
  if (ev.target.matches("[data-int]")) { S.flip = S.int; S.int = ev.target.value; render(); const sel = document.querySelector("[data-int]"); if (sel) sel.focus(); }
});
function pickInt(k) {
  S.iopen = false;
  if (k !== S.int) { S.flip = S.int; S.int = k; S.bopt = null; S.bev = null; S.bmore = false; }
  render(); const b = document.querySelector("[data-iopen]"); if (b) b.focus();
}
function focusOpt(k) {
  const o = [...document.querySelectorAll(".isel-list [role=option]")];
  const i = k != null ? k : Math.max(0, o.findIndex(x => x.getAttribute("aria-selected") === "true"));
  if (o[i]) o[i].focus();
}
document.addEventListener("keydown", ev => {
  // 관심사 목록 키보드: ↑↓ 이동, Enter·Space 고르기, Esc 닫기
  const op = ev.target.closest && ev.target.closest(".isel-list [role=option]");
  if (S.iopen && (op || ev.target.closest && ev.target.closest("[data-iopen]"))) {
    const o = [...document.querySelectorAll(".isel-list [role=option]")], i = o.indexOf(op);
    if (ev.key === "ArrowDown") { ev.preventDefault(); focusOpt(Math.min(o.length - 1, i + 1)); return; }
    if (ev.key === "ArrowUp") { ev.preventDefault(); focusOpt(Math.max(0, i - 1)); return; }
    if ((ev.key === "Enter" || ev.key === " ") && op) { ev.preventDefault(); pickInt(op.dataset.ichip); return; }
    if (ev.key === "Escape") { S.iopen = false; render(); const b = document.querySelector("[data-iopen]"); if (b) b.focus(); return; }
  }
  if (ev.key === "Escape") closeSheet();
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.classList && ev.target.classList.contains("tapstock")) { ev.preventDefault(); if (SHOW_SECTORS && cur().sectors) openSheet(); }
});
addEventListener("resize", () => { syncDbgH(); if (LOAD === "ok") fitFlow(); });
// PC에서 칸 이름이 화면에서 약 14px로 보이게 viewBox 폭을 맞춤 (폰은 그대로)
function fitFlow() {
  const f = document.querySelector(".flow");
  const want = f && matchMedia("(min-width: 1024px)").matches ? Math.max(0, Math.round(((f.clientWidth - 2 * parseFloat(getComputedStyle(f).paddingLeft)) * 13 / 14 - 360) / 2)) : 0;
  if (Math.abs(want - FLOW_D) > 2) { FLOW_D = want; render(); }
}
load();
